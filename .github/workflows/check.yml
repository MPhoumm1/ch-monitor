name: Chrome Hearts Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:        # Lets you click "Run Now" to test

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Crucial: allows the bot to save link_history.txt
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Monitor Script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Save History Changes
        run: |
          git config --global user.name "CH-Monitor-Bot"
          git config --global user.email "bot@github.com"
          git add link_history.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update history" && git push)
